services:
  mt4_Origin2:
    build: .
    image: mt4
    container_name: mt4_Origin_2
    volumes:
      - ./configOrigin2:/config
    ports:
      - "4002:3000"
    environment:
      - CUSTOM_USER=${CUSTOM_USER}
      - PASSWORD=${PASSWORD}
      - LANG=zh_CN.UTF-8
      - LC_ALL=zh_CN.UTF-8
      - LANGUAGE=zh_CN:zh
      - LC_CTYPE=zh_CN.UTF-8
    env_file:
      - .env
    restart: always
    networks:
      - metatrader5-docker-11_default

networks:
  metatrader5-docker-11_default:
    driver: bridge
